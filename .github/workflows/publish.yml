name: Publish to PyPI

# Runs when a GitHub release is published. Tag the release vX.Y.Z to match
# phoney.__version__.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip build twine pytest
      - run: python -m pytest
      - name: Check tag matches package version
        if: github.event_name == 'release'
        run: |
          version=$(python -c "import phoney; print(phoney.__version__)")
          tag="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$tag" ]; then
            echo "::error::Release tag $GITHUB_REF_NAME does not match phoney.__version__ ($version)"
            exit 1
          fi
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # lets PyPI Trusted Publishing work if you switch to it
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      # Uses the PYPI_API_TOKEN repository secret. If that secret is unset the
      # action falls back to PyPI Trusted Publishing.
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
