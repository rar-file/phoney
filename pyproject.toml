[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "phoney"
dynamic = ["version"]
description = "A fake information generator for creating realistic personal data including names, phone numbers, emails, and more."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "rarfile", email = "d7276250@email.com"},
]
maintainers = [
    {name = "rarfile", email = "d7276250@email.com"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities",
]
keywords = [
    "fake data",
    "testing",
    "generator",
    "mock",
    "personal information",
]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7"]
# Only needed to rebuild phoney/data/name_data with tools/build_name_data.py
build-data = ["faker==40.40.0"]

[project.scripts]
phoney-build-prefixes = "phoney.tools.build_prefixes:main"

[project.urls]
Homepage = "https://github.com/rar-file/phoney"
Repository = "https://github.com/rar-file/phoney"
Issues = "https://github.com/rar-file/phoney/issues"
Changelog = "https://github.com/rar-file/phoney/releases"

[tool.flit.module]
name = "phoney"

[tool.flit.sdist]
include = ["tests/", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
